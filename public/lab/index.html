<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pharmacy / Lab — KIHD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kihd.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span data-logo></span><div><b>KIHD</b><span>Pharmacy &amp; Lab</span></div></div>
  <div class="top-right">
    <span class="live off" id="live">Connecting…</span>
    <span class="role-chip">Pharmacy</span>
    <span class="user-chip" id="me"></span>
    <button class="btn ghost sm" id="logout">Log out</button>
  </div>
</header>

<main class="container">
  <div class="kpis stagger">
    <div class="card kpi k1"><div class="ico">📥</div><div><b id="kPending" data-v="0">0</b><span>Pending prescriptions</span></div></div>
    <div class="card kpi k2"><div class="ico">⚠️</div><div><b id="kLow" data-v="0">0</b><span>Low on stock</span></div></div>
    <div class="card kpi k3"><div class="ico">🚫</div><div><b id="kOut" data-v="0">0</b><span>Out of stock</span></div></div>
    <div class="card kpi k4"><div class="ico">✅</div><div><b id="kDone" data-v="0">0</b><span>Dispensed today</span></div></div>
  </div>

  <div id="alerts" class="alert" hidden></div>

  <section class="card anim" style="margin-bottom:20px">
    <h2>📥 Incoming prescriptions <span id="rxCount" class="count" hidden></span></h2>
    <div id="queue" class="rx-grid"></div>
  </section>

  <section class="card anim" style="margin-bottom:20px">
    <h2>📦 Inventory</h2>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg>
        <input id="filter" type="search" placeholder="Filter by brand or formula…">
      </div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Medicine</th><th>Formula</th><th>Status</th><th>Stock</th><th>Low-stock at</th><th></th></tr></thead>
        <tbody id="inv"></tbody>
      </table>
    </div>
  </section>

  <section class="card anim">
    <h2>➕ Add new medicine</h2>
    <form id="addForm" class="add">
      <label class="f">Brand name *<input name="name" required></label>
      <label class="f">Formula *<input name="formula" required placeholder="e.g. Aspirin 75mg"></label>
      <label class="f">Form<select name="form"><option>Tablet</option><option>Capsule</option><option>Syrup</option><option>Injection</option><option>Sublingual</option><option>Inhaler</option><option>Sachet</option></select></label>
      <label class="f">Stock<input name="stock" type="number" min="0" value="0"></label>
      <label class="f">Price (Rs)<input name="price" type="number" min="0" step="0.01" value="0"></label>
      <label class="f">Low-stock alert at<input name="threshold" type="number" min="0" value="10"></label>
      <button class="btn" type="submit">Add medicine</button>
    </form>
  </section>
</main>

<script src="/shared.js"></script>
<script>
let meds = [];
let rxs = [];
let invStale = false;
const $ = (id) => document.getElementById(id);

const statusOf = (m) => (m.stock <= 0 ? ['bad', 'Out of stock'] : m.stock <= m.threshold ? ['warn', 'Low'] : ['ok', 'In stock']);

function renderKpis() {
  countTo($('kPending'), rxs.filter((r) => r.status === 'pending').length);
  countTo($('kLow'), meds.filter((m) => m.stock > 0 && m.stock <= m.threshold).length);
  countTo($('kOut'), meds.filter((m) => m.stock <= 0).length);
  const today = new Date().toDateString();
  countTo($('kDone'), rxs.filter((r) => r.status === 'dispensed' && r.dispensedAt && new Date(r.dispensedAt).toDateString() === today).length);
}

function renderAlerts() {
  const low = meds.filter((m) => m.stock <= m.threshold).sort((a, b) => a.stock - b.stock);
  const box = $('alerts');
  box.hidden = !low.length;
  if (!low.length) return;
  box.innerHTML = `<strong>⚠️ Restock needed (${low.length})</strong><div class="chips">` + low.map((m) =>
    `<span class="chip ${m.stock <= 0 ? 'out' : ''}">${esc(m.name)} <span class="muted">${esc(m.formula)}</span> · ${m.stock <= 0 ? 'out of stock' : m.stock + ' left'}</span>`).join('') + '</div>';
}

function renderQueue() {
  const pending = rxs.filter((r) => r.status === 'pending');
  $('rxCount').hidden = !pending.length;
  $('rxCount').textContent = pending.length;
  if (!pending.length) { $('queue').innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="big">🎉</span>All caught up. No pending prescriptions.</div>'; return; }
  const byId = Object.fromEntries(meds.map((m) => [m.id, m]));
  $('queue').innerHTML = pending.map((r) => {
    const items = r.items.map((it) => {
      const ok = (byId[it.medicineId]?.stock ?? 0) >= it.qty;
      return `<li><span><strong>${esc(it.name)}</strong> × ${esc(it.qty)}<br><span class="muted small">${esc(it.formula)}</span>` +
        `${it.dosage ? `<br><span class="small">${esc(it.dosage)}</span>` : ''}</span>` +
        `<span class="badge ${ok ? 'ok' : 'bad'}">${ok ? 'available' : 'short'}</span></li>`;
    }).join('');
    return `<div class="rx"><div class="rx-head"><span class="rx-id">${esc(r.id)}</span>${r.patient.token ? `<span class="badge info">Token ${esc(r.patient.token)}</span>` : ''}</div>` +
      `<div class="rx-patient"><b>${esc(r.patient.name)}</b><span class="muted">${r.patient.age ? ', ' + esc(r.patient.age) + ' y' : ''}</span><br>` +
      `<span class="muted small">${esc(r.doctor)} · ${esc(timeAgo(r.createdAt))}</span></div>` +
      `<ul>${items}</ul><button class="btn" data-dispense="${esc(r.id)}">Dispense ✓</button></div>`;
  }).join('');
}

function renderInventory() {
  const q = $('filter').value.trim().toLowerCase();
  const rows = meds.filter((m) => !q || m.name.toLowerCase().includes(q) || m.formula.toLowerCase().includes(q));
  // Don't clobber a field the user is typing in; redraw once they leave it.
  if (document.activeElement && $('inv').contains(document.activeElement)) { invStale = true; return; }
  invStale = false;
  $('inv').innerHTML = rows.map((m) => {
    const [cls, label] = statusOf(m);
    return `<tr data-id="${esc(m.id)}"><td><strong>${esc(m.name)}</strong><br><span class="muted small">${esc(m.form)} · Rs ${esc(m.price)}</span></td>` +
      `<td>${esc(m.formula)}</td><td><span class="badge ${cls}">${label}</span></td>` +
      `<td><input type="number" min="0" data-field="stock" value="${m.stock}"></td>` +
      `<td><input type="number" min="0" data-field="threshold" value="${m.threshold}"></td>` +
      `<td><button class="btn ghost sm" data-restock="${esc(m.id)}">+50</button></td></tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">No medicines match.</td></tr>';
}

const renderMeds = () => { renderAlerts(); renderInventory(); renderQueue(); renderKpis(); };
async function loadMeds() {
  const data = await api('/api/medicines');
  if (changed('meds', data)) { meds = data; renderMeds(); }
}
async function loadRx() {
  const data = await api('/api/prescriptions');
  if (changed('rxs', data)) { rxs = data; renderQueue(); renderKpis(); }
}

$('filter').addEventListener('input', renderInventory);
$('inv').addEventListener('focusout', () => { if (invStale) setTimeout(renderInventory, 0); });

$('inv').addEventListener('change', async (e) => {
  const field = e.target.dataset.field;
  if (!field) return;
  const id = e.target.closest('tr').dataset.id;
  try { await api('/api/medicines', { id, [field]: Number(e.target.value) }); toast('Saved ✓', 'ok'); } catch (err) { toast(err.message, 'err'); }
  e.target.blur();
  loadMeds();
});

$('inv').addEventListener('click', async (e) => {
  const id = e.target.dataset.restock;
  if (!id) return;
  const m = meds.find((x) => x.id === id);
  try { await api('/api/medicines', { id, stock: m.stock + 50 }); toast(`${m.name}: +50 added`, 'ok'); } catch (err) { toast(err.message, 'err'); }
  loadMeds();
});

$('queue').addEventListener('click', async (e) => {
  const id = e.target.dataset.dispense;
  if (!id) return;
  e.target.disabled = true;
  try { await api(`/api/prescriptions/${encodeURIComponent(id)}/dispense`, {}); toast(`${id} dispensed ✓ stock updated`, 'ok'); }
  catch (err) { toast(err.message, 'err'); e.target.disabled = false; }
  loadMeds(); loadRx();
});

$('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  try {
    await api('/api/medicines', {
      name: f.name, formula: f.formula, form: f.form, stock: Number(f.stock), price: Number(f.price), threshold: Number(f.threshold),
    });
    e.target.reset();
    e.target.threshold.value = 10;
    toast(`${f.name} added ✓`, 'ok');
    loadMeds();
  } catch (err) { toast(err.message, 'err'); }
});

$('logout').onclick = logout;

// New prescriptions from the doctor side and stock changes arrive through this poll.
requireRole('pharmacy').then((me) => {
  $('me').textContent = me.name;
  startPolling(() => Promise.all([loadMeds(), loadRx()]), $('live'));
});
</script>
</body>
</html>

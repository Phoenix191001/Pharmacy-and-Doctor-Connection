<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pharmacy / Lab — KIHD</title>
<link rel="stylesheet" href="../shared.css">
<style>
  .alert { border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; background: var(--warn-bg); border: 1px solid var(--warn); }
  .alert ul { margin: 6px 0 0; padding-left: 18px; }
  .alert .out { color: var(--bad); font-weight: 600; }
  .alert .low { color: var(--warn); font-weight: 600; }
  .rx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .rx { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
  .rx-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .rx ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .rx li { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .rx .btn { margin-top: auto; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td input[type=number] { width: 78px; }
  .filter { width: 100%; max-width: 320px; margin-bottom: 10px; }
  form.add { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
  form.add label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .srvbar:not([hidden]) { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Pharmacy / Lab <span class="muted" style="font-weight:400">· Karachi Institute of Heart Diseases</span></h1>
    <span id="live" class="live off">○ Reconnecting</span>
  </header>

  <div id="srvbar" class="card srvbar" hidden><span>Opened as a file. Server address:</span><input id="srv" style="flex:1;min-width:200px"><button class="btn" id="srvgo">Connect</button></div>
  <div id="alerts" class="alert" hidden></div>

  <section class="card">
    <h2>Incoming prescriptions <span id="rxCount" class="muted"></span></h2>
    <div id="queue" class="rx-grid"></div>
  </section>

  <section class="card">
    <h2>Inventory</h2>
    <input id="filter" class="filter" type="search" placeholder="Filter by brand or formula…">
    <div class="tablewrap">
      <table>
        <thead><tr><th>Medicine</th><th>Formula</th><th>Status</th><th>Stock</th><th>Low-stock at</th><th></th></tr></thead>
        <tbody id="inv"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Add new medicine</h2>
    <form id="addForm" class="add">
      <label>Brand name *<input name="name" required></label>
      <label>Formula *<input name="formula" required></label>
      <label>Stock<input name="stock" type="number" min="0" value="0"></label>
      <label>Price (Rs)<input name="price" type="number" min="0" step="0.01" value="0"></label>
      <label>Low-stock alert at<input name="threshold" type="number" min="0" value="10"></label>
      <button class="btn" type="submit">Add medicine</button>
    </form>
  </section>
</div>

<script src="../shared.js"></script>
<script>
let meds = [];
let rxs = [];
const $ = (id) => document.getElementById(id);

const statusOf = (m) => (m.stock <= 0 ? ['bad', 'Out of stock'] : m.stock <= m.threshold ? ['warn', 'Low'] : ['ok', 'In stock']);

function renderAlerts() {
  const low = meds.filter((m) => m.stock <= m.threshold).sort((a, b) => a.stock - b.stock);
  const box = $('alerts');
  box.hidden = !low.length;
  if (!low.length) return;
  box.innerHTML = `<strong>Restock needed (${low.length})</strong><ul>` + low.map((m) =>
    `<li class="${m.stock <= 0 ? 'out' : 'low'}">${esc(m.name)} <span class="muted">(${esc(m.formula)})</span> — ` +
    `${m.stock <= 0 ? 'out of stock' : m.stock + ' left, alert at ' + m.threshold}</li>`).join('') + '</ul>';
}

function renderQueue() {
  const pending = rxs.filter((r) => r.status === 'pending');
  $('rxCount').textContent = pending.length ? `(${pending.length})` : '';
  if (!pending.length) { $('queue').innerHTML = '<p class="empty">No pending prescriptions.</p>'; return; }
  const byId = Object.fromEntries(meds.map((m) => [m.id, m]));
  $('queue').innerHTML = pending.map((r) => {
    const items = r.items.map((it) => {
      const ok = (byId[it.medicineId]?.stock ?? 0) >= it.qty;
      return `<li><span><strong>${esc(it.name)}</strong> × ${esc(it.qty)}<br><span class="muted">${esc(it.formula)}${it.dosage ? ' · ' + esc(it.dosage) : ''}</span></span>` +
        `<span class="badge ${ok ? 'ok' : 'bad'}">${ok ? 'available' : 'short'}</span></li>`;
    }).join('');
    return `<div class="rx"><div class="rx-head"><span>${esc(r.id)}</span><span>${r.patient.token ? 'Token ' + esc(r.patient.token) : ''}</span></div>` +
      `<div>${esc(r.patient.name)}<span class="muted">${r.patient.age ? ', ' + esc(r.patient.age) + ' y' : ''}</span><br><span class="muted">${esc(r.doctor)}</span></div>` +
      `<ul>${items}</ul><button class="btn" data-dispense="${esc(r.id)}">Dispense</button></div>`;
  }).join('');
}

function renderInventory() {
  const q = $('filter').value.trim().toLowerCase();
  const rows = meds.filter((m) => !q || m.name.toLowerCase().includes(q) || m.formula.toLowerCase().includes(q));
  // Don't clobber a field the user is typing in.
  if (document.activeElement && $('inv').contains(document.activeElement)) return;
  $('inv').innerHTML = rows.map((m) => {
    const [cls, label] = statusOf(m);
    return `<tr data-id="${esc(m.id)}"><td><strong>${esc(m.name)}</strong><br><span class="muted">${esc(m.form)} · Rs ${esc(m.price)}</span></td>` +
      `<td>${esc(m.formula)}</td><td><span class="badge ${cls}">${label}</span></td>` +
      `<td><input type="number" min="0" data-field="stock" value="${m.stock}"></td>` +
      `<td><input type="number" min="0" data-field="threshold" value="${m.threshold}"></td>` +
      `<td><button class="btn secondary" data-restock="${esc(m.id)}">+50</button></td></tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">No medicines match.</td></tr>';
}

const renderMeds = () => { renderAlerts(); renderInventory(); renderQueue(); };
async function loadMeds() { meds = await api('/api/medicines'); renderMeds(); }
async function loadRx() { rxs = await api('/api/prescriptions'); renderQueue(); }

$('filter').addEventListener('input', renderInventory);

$('inv').addEventListener('change', async (e) => {
  const field = e.target.dataset.field;
  if (!field) return;
  const id = e.target.closest('tr').dataset.id;
  try { await api('/api/medicines', { id, [field]: Number(e.target.value) }); } catch (err) { alert(err.message); }
  e.target.blur();
  loadMeds();
});

$('inv').addEventListener('click', async (e) => {
  const id = e.target.dataset.restock;
  if (!id) return;
  const m = meds.find((x) => x.id === id);
  try { await api('/api/medicines', { id, stock: m.stock + 50 }); } catch (err) { alert(err.message); }
  loadMeds();
});

$('queue').addEventListener('click', async (e) => {
  const id = e.target.dataset.dispense;
  if (!id) return;
  e.target.disabled = true;
  try { await api(`/api/prescriptions/${encodeURIComponent(id)}/dispense`, {}); }
  catch (err) { alert(err.message); }
  loadMeds(); loadRx();
});

$('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  try {
    await api('/api/medicines', {
      name: f.name, formula: f.formula, stock: Number(f.stock), price: Number(f.price), threshold: Number(f.threshold),
    });
    e.target.reset();
    e.target.threshold.value = 10;
    loadMeds();
  } catch (err) { alert(err.message); }
});

if (location.protocol === 'file:') {
  $('srvbar').hidden = false;
  $('srv').value = API_BASE;
  $('srvgo').onclick = () => {
    try { localStorage.setItem('apiBase', $('srv').value.trim().replace(/\/+$/, '')); } catch {}
    location.reload();
  };
}

subscribe({ medicines: loadMeds, prescriptions: loadRx }, $('live'));
</script>
</body>
</html>

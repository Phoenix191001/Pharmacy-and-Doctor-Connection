<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Console — KIHD</title>
<link rel="stylesheet" href="../shared.css">
<style>
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .search { width: 100%; margin-bottom: 8px; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; max-height: 260px; overflow-y: auto; }
  .med { text-align: left; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .med:hover:not(:disabled) { border-color: var(--primary); }
  .med:disabled { opacity: .55; cursor: default; }
  .lines { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .line { display: grid; grid-template-columns: 1fr 80px minmax(120px, 1.2fr) auto; gap: 8px; align-items: center; }
  @media (max-width: 640px) { .line { grid-template-columns: 1fr 80px auto; } .line .dose { grid-column: 1 / -1; order: 5; } }
  .empty { color: var(--muted); }
  .hist { display: flex; flex-direction: column; gap: 8px; }
  .hist-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .srvbar:not([hidden]) { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .msg { margin-left: 10px; font-weight: 600; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Doctor Console <span class="muted" style="font-weight:400">· Karachi Institute of Heart Diseases</span></h1>
    <span id="live" class="live off">○ Reconnecting</span>
  </header>

  <div id="srvbar" class="card srvbar" hidden><span>Opened as a file. Server address:</span><input id="srv" style="flex:1;min-width:200px"><button class="btn" id="srvgo">Connect</button></div>

  <section class="card">
    <h2>Patient &amp; doctor</h2>
    <div class="grid2">
      <label>Patient name *<input id="pname" autocomplete="off"></label>
      <label>Age<input id="page" type="number" min="0" max="130"></label>
      <label>Phone<input id="pphone" type="tel"></label>
      <label>Token no.<input id="ptoken" autocomplete="off"></label>
      <label>Doctor<input id="doctor" placeholder="Dr. …"></label>
    </div>
  </section>

  <section class="card">
    <h2>Find medicine</h2>
    <input id="q" class="search" type="search" placeholder="Search by brand or formula…">
    <div id="results" class="results"></div>
  </section>

  <section class="card">
    <h2>Prescription <span id="count" class="muted"></span></h2>
    <ul id="lines" class="lines"></ul>
    <button id="send" class="btn" type="button">Send to pharmacy</button><span id="msg" class="msg"></span>
  </section>

  <section class="card">
    <h2>Sent prescriptions</h2>
    <div id="hist" class="hist"></div>
  </section>
</div>

<script src="../shared.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let meds = [];
let rxs = [];
let lines = []; // { medicineId, qty, dosage }

const stockBadge = (m) => m.stock <= 0 ? ['bad', 'Out of stock'] : m.stock <= m.threshold ? ['warn', m.stock + ' left'] : ['ok', 'In stock'];

function renderResults() {
  const q = $('q').value.trim().toLowerCase();
  const rows = meds.filter((m) => !q || m.name.toLowerCase().includes(q) || m.formula.toLowerCase().includes(q));
  $('results').innerHTML = rows.map((m) => {
    const [cls, label] = stockBadge(m);
    return `<button type="button" class="med" data-add="${esc(m.id)}"><span><strong>${esc(m.name)}</strong><br><span class="muted">${esc(m.formula)} · ${esc(m.form)}</span></span><span class="badge ${cls}">${esc(label)}</span></button>`;
  }).join('') || '<p class="empty">No medicines match.</p>';
}

function renderLines() {
  $('count').textContent = lines.length ? `(${lines.length})` : '';
  if (!lines.length) { $('lines').innerHTML = '<li class="empty">No medicines added yet.</li>'; return; }
  const byId = Object.fromEntries(meds.map((m) => [m.id, m]));
  $('lines').innerHTML = lines.map((l, i) => {
    const m = byId[l.medicineId];
    const warn = m && m.stock < l.qty ? ' <span class="badge bad">only ' + m.stock + ' in stock</span>' : '';
    return `<li class="line" data-i="${i}"><span><strong>${esc(m ? m.name : l.medicineId)}</strong>${warn}<br><span class="muted">${esc(m ? m.formula : '')}</span></span>` +
      `<input type="number" min="1" data-f="qty" value="${esc(l.qty)}" aria-label="Quantity">` +
      `<input class="dose" data-f="dosage" value="${esc(l.dosage)}" placeholder="Dosage e.g. 1 tab twice daily" aria-label="Dosage">` +
      `<button type="button" class="btn secondary" data-rm="${i}">Remove</button></li>`;
  }).join('');
}

function renderHist() {
  if (!rxs.length) { $('hist').innerHTML = '<p class="empty">Nothing sent yet.</p>'; return; }
  $('hist').innerHTML = rxs.slice(0, 15).map((r) =>
    `<div class="hist-item"><span><strong>${esc(r.id)}</strong> · ${esc(r.patient.name)}${r.patient.token ? ' · Token ' + esc(r.patient.token) : ''}<br>` +
    `<span class="muted">${r.items.map((it) => esc(it.name) + ' × ' + esc(it.qty)).join(', ')}</span></span>` +
    `<span class="badge ${r.status === 'dispensed' ? 'ok' : 'warn'}">${r.status === 'dispensed' ? 'Dispensed' : 'Pending'}</span></div>`).join('');
}

async function loadMeds() { meds = await api('/api/medicines'); renderResults(); if (!document.activeElement?.closest('#lines')) renderLines(); }
async function loadRx() { rxs = await api('/api/prescriptions'); renderHist(); }

$('q').addEventListener('input', renderResults);

$('results').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-add]');
  if (!btn) return;
  const id = btn.dataset.add;
  const existing = lines.find((l) => l.medicineId === id);
  if (existing) existing.qty++; else lines.push({ medicineId: id, qty: 1, dosage: '' });
  renderLines();
});

$('lines').addEventListener('input', (e) => {
  const f = e.target.dataset.f;
  if (!f) return;
  const l = lines[e.target.closest('li').dataset.i];
  l[f] = f === 'qty' ? Math.max(0, Math.floor(Number(e.target.value) || 0)) : e.target.value;
});
$('lines').addEventListener('change', renderLines);
$('lines').addEventListener('click', (e) => {
  const i = e.target.dataset.rm;
  if (i === undefined) return;
  lines.splice(Number(i), 1);
  renderLines();
});

function say(text, ok) { $('msg').textContent = text; $('msg').className = 'msg ' + (ok ? 'ok' : 'bad'); }

$('send').addEventListener('click', async () => {
  if (!$('pname').value.trim()) return say('Enter the patient name.', false);
  if (!lines.length) return say('Add at least one medicine.', false);
  if (lines.some((l) => l.qty < 1)) return say('Every quantity must be at least 1.', false);
  $('send').disabled = true;
  try {
    const rx = await api('/api/prescriptions', {
      patient: { name: $('pname').value.trim(), age: $('page').value, phone: $('pphone').value.trim(), token: $('ptoken').value.trim() },
      doctor: $('doctor').value.trim(),
      items: lines.map((l) => ({ medicineId: l.medicineId, qty: l.qty, dosage: l.dosage.trim() })),
    });
    say(`Sent as ${rx.id}.`, true);
    lines = [];
    for (const id of ['pname', 'page', 'pphone', 'ptoken']) $(id).value = '';
    renderLines(); loadRx();
  } catch (err) { say(err.message, false); }
  $('send').disabled = false;
});

try { $('doctor').value = localStorage.getItem('doctorName') || ''; } catch {}
$('doctor').addEventListener('change', () => { try { localStorage.setItem('doctorName', $('doctor').value); } catch {} });

if (location.protocol === 'file:') {
  $('srvbar').hidden = false;
  $('srv').value = API_BASE;
  $('srvgo').onclick = () => {
    try { localStorage.setItem('apiBase', $('srv').value.trim().replace(/\/+$/, '')); } catch {}
    location.reload();
  };
}

renderLines();
subscribe({ medicines: loadMeds, prescriptions: loadRx }, $('live'));
</script>
</body>
</html>
